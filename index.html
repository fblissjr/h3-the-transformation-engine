<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy.

      This page holds a user-supplied API key in localStorage, so the thing that
      matters most is `connect-src`: script running here can only reach the
      Gemini endpoint, the configured heylook server, and this origin.

      The last source in `connect-src` is a placeholder token, not a host. It is
      replaced at build time with the normalized value of VITE_HEYLOOK_ORIGIN by
      the `heylookCsp` plugin in vite.config.ts, which is the SAME value
      src/provider/heylook/config.ts exposes to the app. There is one origin,
      read once, so the policy and the base URL cannot disagree -- and a base
      URL the policy does not name is refused by the browser with no status and
      no response, which is the worst failure shape available. The build fails
      outright if that token is gone.

      This paragraph deliberately does not spell the token: the plugin replaces
      every occurrence, so naming it here would leave the shipped page claiming
      that some hostname "is not a literal".

      Note that no policy can help with mixed content: a plain `http://` origin
      that is not localhost is blocked when this page is served over https,
      whatever connect-src says. Over the http dev server both work.

      `style-src` allows inline because Tailwind injects a <style> element.
      `script-src` does not, so an injected <script> or inline handler is
      refused outright.

      Do NOT add bare `ws:`/`wss:` here. They are scheme-wide sources matching
      ANY host, so they hand a compromised dependency a socket to an arbitrary
      server -- the exfiltration route the rest of this policy exists to close.
      Probed: with them present, a fetch to an unrelated origin is refused while
      a WebSocket to that same origin is allowed. `'self'` already covers the
      Vite dev server's hot-reload socket, which is same-origin.

      `frame-ancestors` is deliberately absent: it is ignored in a <meta> tag.
      Framing protection has to come from a response header instead.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        media-src 'self' data: blob:;
        font-src 'self' data:;
        connect-src 'self' https://generativelanguage.googleapis.com __HEYLOOK_ORIGIN__;
        object-src 'none';
        base-uri 'none';
        form-action 'none';
      "
    />
    <title>H3 Transformation Engine</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
