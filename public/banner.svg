<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Node & Accent Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="380" rx="16" fill="url(#glow-cyan)"/>
  <rect width="1200" height="380" rx="16" fill="url(#glow-violet)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="378" rx="15" stroke="#1e293b" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="376" rx="14" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Subtle Matrix / Technical Grid Background -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="380"/>
    <line x1="250" y1="0" x2="250" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="550" y1="0" x2="550" y2="380"/>
    <line x1="700" y1="0" x2="700" y2="380"/>
    <line x1="850" y1="0" x2="850" y2="380"/>
    <line x1="1000" y1="0" x2="1000" y2="380"/>
    <line x1="1100" y1="0" x2="1100" y2="380"/>

    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="330" x2="1200" y2="330"/>
  </g>

  <!-- Geometric Accent Circles -->
  <circle cx="90" cy="80" r="3" fill="#38bdf8" fill-opacity="0.4"/>
  <circle cx="1110" cy="80" r="3" fill="#818cf8" fill-opacity="0.4"/>
  <circle cx="90" cy="300" r="3" fill="#38bdf8" fill-opacity="0.4"/>
  <circle cx="1110" cy="300" r="3" fill="#c084fc" fill-opacity="0.4"/>

  <!-- Header Category Tag -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text text-anchor="middle" y="4" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.5">
      MINIMAX H3 PROMPT COMPILER
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="112" text-anchor="middle" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="2">
    H3 TRANSFORMATION ENGINE
  </text>

  <!-- Subtitle -->
  <text x="600" y="146" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0.5">
    Deterministic Prompt Compiler, Strict AST Validator &amp; Structured IR Editor
  </text>

  <!-- Pipeline Diagram Nodes -->
  <g transform="translate(100, 185)">
    <!-- Stage 1: AST / IR -->
    <g transform="translate(0, 0)">
      <rect width="140" height="64" rx="8" fill="url(#box-grad)" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="70" y="27" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">INPUT</text>
      <text x="70" y="47" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Document AST</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 148 32 L 176 32 M 170 26 L 176 32 L 170 38" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stage 2: Normalize -->
    <g transform="translate(184, 0)">
      <rect width="140" height="64" rx="8" fill="url(#box-grad)" stroke="#60a5fa" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="70" y="27" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">24 FPS MATH</text>
      <text x="70" y="47" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Normalize</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 332 32 L 360 32 M 354 26 L 360 32 L 354 38" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stage 3: Planner / Model -->
    <g transform="translate(368, 0)">
      <rect width="140" height="64" rx="8" fill="url(#box-grad)" stroke="#818cf8" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="70" y="27" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">INFERENCE</text>
      <text x="70" y="47" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Plan &amp; Assemble</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 516 32 L 544 32 M 538 26 L 544 32 L 538 38" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stage 4: Validate -->
    <g transform="translate(552, 0)">
      <rect width="140" height="64" rx="8" fill="url(#box-grad)" stroke="#34d399" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="70" y="27" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">29 RULES</text>
      <text x="70" y="47" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Validate</text>
    </g>

    <!-- Arrow 4 -->
    <path d="M 700 32 L 728 32 M 722 26 L 728 32 L 722 38" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stage 5: Patch / Edit -->
    <g transform="translate(736, 0)">
      <rect width="124" height="64" rx="8" fill="url(#box-grad)" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="62" y="27" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">SURGICAL</text>
      <text x="62" y="47" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Patch</text>
    </g>

    <!-- Arrow 5 -->
    <path d="M 868 32 L 896 32 M 890 26 L 896 32 L 890 38" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stage 6: Serialize -->
    <g transform="translate(904, 0)">
      <rect width="96" height="64" rx="8" fill="url(#box-grad)" stroke="#f43f5e" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="48" y="27" text-anchor="middle" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">OUTPUT</text>
      <text x="48" y="47" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Prompt</text>
    </g>
  </g>

  <!-- Bottom Pills: Guarantees & Features -->
  <g transform="translate(600, 310)">
    <!-- Pill 1: Pure TS -->
    <g transform="translate(-480, 0)">
      <rect width="220" height="30" rx="15" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="15" r="4" fill="#38bdf8"/>
      <text x="32" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        Pure TypeScript Kernel
      </text>
    </g>

    <!-- Pill 2: 36 Diagnostics -->
    <g transform="translate(-240, 0)">
      <rect width="220" height="30" rx="15" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="15" r="4" fill="#34d399"/>
      <text x="32" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        36 Diagnostics • Errors Only
      </text>
    </g>

    <!-- Pill 3: Byte-Exact -->
    <g transform="translate(0, 0)">
      <rect width="230" height="30" rx="15" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="15" r="4" fill="#fbbf24"/>
      <text x="32" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        Byte-Exact MiniMax Fidelity
      </text>
    </g>

    <!-- Pill 4: Providers -->
    <g transform="translate(250, 0)">
      <rect width="230" height="30" rx="15" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="15" r="4" fill="#c084fc"/>
      <text x="32" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        Gemini &amp; heylook Providers
      </text>
    </g>
  </g>
</svg>
