<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" fill="none">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="friendly-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f6"/>
      <stop offset="35%" stop-color="#faf5ff"/>
      <stop offset="70%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#f6fffa"/>
    </linearGradient>

    <!-- Warm Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="pill-shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Outer Card Container -->
  <g filter="url(#card-shadow)">
    <rect x="12" y="10" width="1176" height="340" rx="24" fill="url(#friendly-bg)" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>

  <!-- Whimsical Background Doodles & Accents -->
  <!-- Sparkles & Stars -->
  <g fill="#f59e0b" opacity="0.75">
    <!-- Star top-left -->
    <path d="M 95 65 Q 95 80 80 80 Q 95 80 95 95 Q 95 80 110 80 Q 95 80 95 65 Z" fill="#fbbf24"/>
    <circle cx="125" cy="55" r="3" fill="#f43f5e"/>
    <circle cx="70" cy="105" r="2.5" fill="#3b82f6"/>
    
    <!-- Star top-right -->
    <path d="M 1100 65 Q 1100 80 1085 80 Q 1100 80 1100 95 Q 1100 80 1115 80 Q 1100 80 1100 65 Z" fill="#818cf8"/>
    <circle cx="1065" cy="55" r="3.5" fill="#ec4899"/>
    <circle cx="1125" cy="100" r="2.5" fill="#10b981"/>

    <!-- Bottom accents -->
    <path d="M 75 270 Q 75 280 65 280 Q 75 280 75 290 Q 75 280 85 280 Q 75 280 75 270 Z" fill="#38bdf8"/>
    <circle cx="100" cy="295" r="3" fill="#fbbf24"/>
    <path d="M 1115 260 Q 1115 270 1105 270 Q 1115 270 1115 280 Q 1115 270 1125 270 Q 1115 270 1115 260 Z" fill="#fb7185"/>
  </g>

  <!-- Playful Floating Confetti Rings & Blobs -->
  <circle cx="160" cy="70" r="14" fill="none" stroke="#fed7aa" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6"/>
  <circle cx="1025" cy="75" r="12" fill="none" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 5"/>
  <rect x="1080" y="160" width="12" height="12" rx="3" fill="#fbcfe8" transform="rotate(25 1086 166)"/>
  <rect x="105" y="175" width="10" height="10" rx="3" fill="#bae6fd" transform="rotate(-15 110 180)"/>

  <!-- Friendly Top Category Badge -->
  <g transform="translate(600, 48)">
    <rect x="-145" y="-14" width="290" height="28" rx="14" fill="#fff" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1.5"/>
    <text text-anchor="middle" y="4.5" fill="#e11d48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">
      ✨ THE MINIMAX H3 PROMPT COMPILER ✨
    </text>
  </g>

  <!-- Title -->
  <text x="600" y="112" text-anchor="middle" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="37" font-weight="800" letter-spacing="-0.5">
    H3 Transformation Engine
  </text>

  <!-- Subtitle -->
  <text x="600" y="146" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="500">
    Turning wild video ideas into structured, byte-exact MiniMax prompts 🎬✨
  </text>

  <!-- Playful Visual Pipeline -->
  <g transform="translate(125, 175)">
    <!-- Stage 1: Idea -->
    <g transform="translate(0, 0)" filter="url(#pill-shadow)">
      <rect width="145" height="66" rx="18" fill="#fff" stroke="#fcd34d" stroke-width="2"/>
      <rect x="8" y="8" width="30" height="30" rx="10" fill="#fef3c7"/>
      <text x="23" y="28" text-anchor="middle" font-size="16">💡</text>
      <text x="46" y="25" fill="#b45309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">INPUT</text>
      <text x="46" y="44" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Story Idea</text>
    </g>

    <!-- Connector 1 -->
    <g transform="translate(152, 28)">
      <path d="M 0 5 Q 16 -4 32 5" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4"/>
      <path d="M 28 2 L 34 5 L 30 10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Stage 2: Normalize -->
    <g transform="translate(192, 0)" filter="url(#pill-shadow)">
      <rect width="145" height="66" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
      <rect x="8" y="8" width="30" height="30" rx="10" fill="#eff6ff"/>
      <text x="23" y="28" text-anchor="middle" font-size="16">⏱️</text>
      <text x="46" y="25" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">24 FPS MATH</text>
      <text x="46" y="44" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Normalize</text>
    </g>

    <!-- Connector 2 -->
    <g transform="translate(344, 28)">
      <path d="M 0 5 Q 16 14 32 5" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4"/>
      <path d="M 28 0 L 34 5 L 30 10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Stage 3: Plan -->
    <g transform="translate(384, 0)" filter="url(#pill-shadow)">
      <rect width="150" height="66" rx="18" fill="#fff" stroke="#c084fc" stroke-width="2"/>
      <rect x="8" y="8" width="30" height="30" rx="10" fill="#faf5ff"/>
      <text x="23" y="28" text-anchor="middle" font-size="16">🪄</text>
      <text x="46" y="25" fill="#7e22ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">INFERENCE</text>
      <text x="46" y="44" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Plan &amp; Prose</text>
    </g>

    <!-- Connector 3 -->
    <g transform="translate(541, 28)">
      <path d="M 0 5 Q 16 -4 32 5" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4"/>
      <path d="M 28 2 L 34 5 L 30 10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Stage 4: Validate -->
    <g transform="translate(581, 0)" filter="url(#pill-shadow)">
      <rect width="150" height="66" rx="18" fill="#fff" stroke="#86efac" stroke-width="2"/>
      <rect x="8" y="8" width="30" height="30" rx="10" fill="#f0fdf4"/>
      <text x="23" y="28" text-anchor="middle" font-size="16">🔍</text>
      <text x="46" y="25" fill="#15803d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">29 RULES</text>
      <text x="46" y="44" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Check Errors</text>
    </g>

    <!-- Connector 4 -->
    <g transform="translate(738, 28)">
      <path d="M 0 5 Q 16 14 32 5" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4"/>
      <path d="M 28 0 L 34 5 L 30 10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Stage 5: Serialize Output -->
    <g transform="translate(778, 0)" filter="url(#pill-shadow)">
      <rect width="168" height="66" rx="18" fill="#fff" stroke="#fda4af" stroke-width="2"/>
      <rect x="8" y="8" width="30" height="30" rx="10" fill="#fff1f2"/>
      <text x="23" y="28" text-anchor="middle" font-size="16">🎬</text>
      <text x="46" y="25" fill="#be123c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">H3 PROMPT</text>
      <text x="46" y="44" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Ready to Render</text>
    </g>
  </g>

  <!-- Friendly Pill Badges across bottom -->
  <g transform="translate(600, 298)">
    <!-- Pill 1 -->
    <g transform="translate(-460, 0)">
      <rect width="210" height="32" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="105" y="20.5" text-anchor="middle" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        🌱 Pure TypeScript Kernel
      </text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-230, 0)">
      <rect width="220" height="32" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="110" y="20.5" text-anchor="middle" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        🎯 36 Zero-Cry-Wolf Errors
      </text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(10, 0)">
      <rect width="220" height="32" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="110" y="20.5" text-anchor="middle" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        📐 Byte-Exact MiniMax Fidelity
      </text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(250, 0)">
      <rect width="210" height="32" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="105" y="20.5" text-anchor="middle" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        🏡 Local &amp; Hosted Providers
      </text>
    </g>
  </g>
</svg>
